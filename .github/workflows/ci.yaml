name: Build and push image

on:
  push:
    branches: [ "devops" ]
  pull_request:
    branches: [ "devops" ]

jobs:
    deploy:
        runs-on: ubuntu-latest
    
        steps:
        - name: Check out the repository
          uses: actions/checkout@v4

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
    
        - name: Build and push Docker image
          run: |
            docker build -t sasibk/annapurnaweb:${{ github.run_number  }} .
            docker push sasibk/annapurnaweb:${{ github.run_number }}
        
            #- name: Set Kubeconfig
            #run: |
            #mkdir -p $HOME/.kube
            #echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
            #kubectl config set-cluster default --insecure-skip-tls-verify=true
         
        - name: Update Kubernetes manifest
          run: |
            #sed -i "s|image: .*|image: sasibk/annapurnaweb:${{ github.run_number }}|" k8s/deployment.yaml
            IMAGE_TAG=${{ github.run_number }}
            echo "Updating image to $IMAGE_TAG"
            sed -i "s|image: sasibk/annapurnaweb:.*|image: sasibk/annapurnaweb:${IMAGE_TAG}|" k8s/deployment.yaml
            cat k8s/deployment.yaml

        - name: Commit and push changes
          run: |
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add k8s/deployment.yaml
            git commit -m "Update image to ${{ github.run_number }}"
            git push
          
          #- name: Deploy to Kubernetes
          #run: |
          # kubectl set image deployment/annapurnaweb \
          # app=sasibk/annapurnaweb:${{ github.run_number }}    
